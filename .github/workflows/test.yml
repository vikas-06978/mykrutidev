# Every push and pull request: unit tests, the build (with its PDF, image and
# service-worker steps), the checks on the built site - including the feedback
# API through `wrangler pages dev`, which may NOT be skipped here (CI=true, see
# tests/feedback-pages.test.js) - and the browser tests.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A test UPI ID, so the support page is built and checked the way it
      # goes live. The real ID is set only in Cloudflare Pages, never here.
      PUBLIC_UPI_ID: mykrutidev.test@upi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The same Node as local development (.nvmrc).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium draws the PDFs and social images during the build, and runs
      # the browser tests.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The Pages Functions bundled the way Cloudflare bundles them: with
      # wrangler 3 (esbuild 0.17, the version that rejected import attributes
      # on Cloudflare) and with the current wrangler.
      - run: npm run test:functions
      - run: npm run build
      - run: npm run test:dist
      - run: npx playwright test
      # And without a UPI ID, as on a laptop: no payment anywhere, no footer link.
      - name: Build and check with the support option off
        env:
          PUBLIC_UPI_ID: ''
        run: npx astro build && npm run test:dist
      # On failure, the traces and screenshots, to open with npx playwright show-trace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7